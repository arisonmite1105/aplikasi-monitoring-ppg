
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cute Health Monitor</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    padding: 35px 15px;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #fce4ec, #f4e9fa, #fff1e6);
    color: #62546b;
}

.container {
    width: 100%;
    max-width: 850px;
    margin: auto;
    background: rgba(255,255,255,0.88);
    padding: 30px;
    border-radius: 25px;
    box-shadow: 0 12px 35px rgba(128, 90, 130, 0.12);
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 25px;
}

h1 {
    color: #c77d9b;
    font-size: 27px;
    margin: 0;
}

.header-buttons {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

button {
    border: none;
    padding: 12px 17px;
    border-radius: 14px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    transition: 0.2s;
}

button:hover {
    transform: translateY(-2px);
    opacity: 0.85;
}

.connect {
    background: #e8e5fa;
    color: #746b9a;
}

.simulate {
    background: #ffe8d5;
    color: #aa7955;
}

.save {
    background: #dff2e5;
    color: #59886a;
}

.download {
    background: #f5dce8;
    color: #a85f81;
}

.status {
    margin: 18px 0;
    padding: 12px;
    background: #faf5fa;
    border-radius: 12px;
    font-size: 14px;
}

.status-dot {
    color: #d58cab;
    font-weight: bold;
}

.input-group {
    margin: 18px 0;
}

label {
    display: block;
    margin-bottom: 9px;
    font-weight: 600;
    color: #8b7895;
}

input {
    width: 100%;
    padding: 15px;
    border: 1.5px solid #e6dce9;
    border-radius: 14px;
    outline: none;
    background: #fff;
    color: #62546b;
    font-size: 14px;
}

input:focus {
    border-color: #d89bb7;
}

.measurements {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
    margin: 20px 0;
}

.measurement {
    padding: 20px;
    border-radius: 17px;
    background: #fff3f7;
    position: relative;
}

.measurement.temperature {
    background: #fff3e8;
}

.measurement h3 {
    font-size: 14px;
    margin: 0 0 12px;
    color: #987c94;
}

.measurement .number {
    font-size: 30px;
    font-weight: bold;
    color: #c8799b;
}

.temperature .number {
    color: #d49a65;
}

.unit {
    font-size: 13px;
    color: #a18fa4;
}

.save-area {
    display: flex;
    justify-content: flex-end;
    margin: 15px 0 25px;
}

.history {
    margin-top: 25px;
}

.history h2 {
    font-size: 18px;
    color: #b87998;
    margin-bottom: 15px;
}

.table-wrapper {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 400px;
    text-align: center;
}

thead {
    background: #f8e2d3;
    color: #9e705b;
}

th, td {
    padding: 14px 10px;
    border-bottom: 1px solid #f0e5ec;
    font-size: 13px;
}

tbody tr:hover {
    background: #fff8fb;
}

.download-area {
    display: flex;
    justify-content: flex-end;
    margin-top: 20px;
}

.footer {
    text-align: center;
    margin-top: 25px;
    font-size: 11px;
    color: #b4a4b6;
}

@media (max-width: 550px) {
    .container {
        padding: 20px;
    }

    .header {
        align-items: flex-start;
        flex-direction: column;
    }

    .measurements {
        grid-template-columns: 1fr;
    }

    h1 {
        font-size: 23px;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- HEADER -->
    <div class="header">
        <h1>🎀 Health Tracker</h1>

        <div class="header-buttons">
            <button class="connect" onclick="connectBluetooth()">
                ♟ Connect BLE
            </button>

            <button class="simulate" onclick="toggleSimulation()">
                🧸 Mode Simulasi
            </button>
        </div>
    </div>

    <!-- STATUS -->
    <div class="status">
        <span class="status-dot">●</span>
        <span id="status">Status: Terputus</span>
    </div>

    <!-- RESPONDEN -->
    <div class="input-group">
        <label>👤 Nama Responden:</label>
        <input type="text" id="nama"
        placeholder="Masukkan nama atau kode responden...">
    </div>

    <!-- HEART RATE -->
    <div class="measurements">

        <div class="measurement">
            <h3>💗 Heart Rate</h3>
            <span class="number" id="hr">--</span>
            <span class="unit">BPM</span>
        </div>

        <div class="measurement temperature">
            <h3>🌡️ Suhu Tubuh</h3>
            <span class="number" id="temp">--</span>
            <span class="unit">°C</span>
        </div>

    </div>

    <!-- SAVE -->
    <div class="save-area">
        <button class="save" onclick="saveData()">
            💾 Save
        </button>
    </div>

    <!-- HISTORY -->
    <div class="history">
        <h2>📋 Riwayat Pengukuran</h2>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Nama</th>
                        <th>H.R (bpm)</th>
                        <th>Temperature (°C)</th>
                    </tr>
                </thead>

                <tbody id="history">
                </tbody>
            </table>
        </div>
    </div>

    <!-- DOWNLOAD -->
    <div class="download-area">
        <button class="download" onclick="downloadCSV()">
            📊 Download Data (CSV)
        </button>
    </div>

    <div class="footer">
        Cute Health Monitor | ESP32 & MAX30102
    </div>

</div>

<script>

// =====================================
// BLUETOOTH CONFIGURATION
// =====================================

// UUID contoh. Harus disamakan dengan
// UUID BLE pada program ESP32.

const SERVICE_UUID =
"12345678-1234-1234-1234-1234567890ab";

const CHARACTERISTIC_UUID =
"abcdefab-1234-1234-1234-abcdefabcdef";

let characteristic = null;
let buffer = "";

let currentHR = null;
let currentTemp = null;

let savedData = [];
let simulationTimer = null;

// =====================================
// BLUETOOTH CONNECTION
// =====================================

async function connectBluetooth() {

    try {

        if (!navigator.bluetooth) {
            alert("Browser belum mendukung Web Bluetooth.");
            return;
        }

        const device = await navigator.bluetooth.requestDevice({
            filters: [{ services: [SERVICE_UUID] }]
        });

        const server = await device.gatt.connect();

        const service =
        await server.getPrimaryService(SERVICE_UUID);

        characteristic =
        await service.getCharacteristic(CHARACTERISTIC_UUID);

        await characteristic.startNotifications();

        characteristic.addEventListener(
            "characteristicvaluechanged",
            receiveData
        );

        document.getElementById("status").textContent =
        "Status: Terhubung ke " + (device.name || "ESP32");

        device.addEventListener("gattserverdisconnected", () => {
            document.getElementById("status").textContent =
            "Status: Terputus";
        });

    } catch(error) {

        document.getElementById("status").textContent =
        "Status: Gagal terhubung";

        alert("Koneksi gagal: " + error.message);
    }
}

// =====================================
// RECEIVE DATA FROM ESP32
// Format: waktu,suhu,HR
// =====================================

function receiveData(event) {

    const value = event.target.value;

    const bytes = new Uint8Array(
        value.buffer,
        value.byteOffset,
        value.byteLength
    );

    buffer += new TextDecoder().decode(bytes);

    const lines = buffer.split("\n");
    buffer = lines.pop();

    lines.forEach(line => {

        const parts = line.trim().split(",");

        if(parts.length !== 3) return;

        const [time, temp, hr] = parts.map(Number);

        if(![time, temp, hr].every(Number.isFinite)) return;

        if(temp <= 0 || hr <= 0) return;

        updateDisplay(hr, temp);
    });
}

// =====================================
// UPDATE DISPLAY
// =====================================

function updateDisplay(hr, temp) {

    currentHR = hr;
    currentTemp = temp;

    document.getElementById("hr").textContent = hr;

    document.getElementById("temp").textContent =
    Number(temp).toFixed(1);
}

// =====================================
// SIMULATION MODE
// Data ini hanya data DEMO
// =====================================

function toggleSimulation() {

    if(simulationTimer) {

        clearInterval(simulationTimer);
        simulationTimer = null;

        document.getElementById("status").textContent =
        "Status: Simulasi dihentikan";

        return;
    }

    document.getElementById("status").textContent =
    "Status: Mode Simulasi (Data Demo)";

    simulationTimer = setInterval(() => {

        const hr = Math.floor(70 + Math.random() * 16);

        const temp =
        (36 + Math.random() * 1.5).toFixed(1);

        updateDisplay(hr, temp);

    }, 2000);
}

// =====================================
// SAVE MEASUREMENT
// =====================================

function saveData() {

    const nama =
    document.getElementById("nama").value.trim();

    if(!nama) {
        alert("Masukkan nama atau kode responden!");
        return;
    }

    if(currentHR === null || currentTemp === null) {
        alert("Belum ada data pengukuran!");
        return;
    }

    const record = {
        nama: nama,
        hr: currentHR,
        temp: currentTemp,
        date: new Date().toLocaleString("id-ID")
    };

    savedData.push(record);

    const row = document.createElement("tr");

    [record.nama, record.hr, record.temp.toFixed(1)]
    .forEach(value => {

        const cell = document.createElement("td");
        cell.textContent = value;
        row.appendChild(cell);

    });

    document.getElementById("history").appendChild(row);

    alert("Data berhasil disimpan!");

}

// =====================================
// DOWNLOAD CSV
// =====================================

function downloadCSV() {

    if(savedData.length === 0) {
        alert("Belum ada data yang disimpan!");
        return;
    }

    let csv =
    "Nama,Tanggal dan Waktu,Heart Rate (BPM),Suhu Tubuh (C)\n";

    savedData.forEach(data => {

        const nama = '"' + data.nama.replace(/"/g, '""') + '"';
        const date = '"' + data.date + '"';

        csv +=
        `${nama},${date},${data.hr},${data.temp}\n`;

    });

    const blob = new Blob(
        ["\uFEFF" + csv],
        { type: "text/csv;charset=utf-8;" }
    );

    const url = URL.createObjectURL(blob);

    const link = document.createElement("a");

    link.href = url;
    link.download = "Data_Monitoring_PPG.csv";

    link.click();

    URL.revokeObjectURL(url);
}

</script>

</body>
</html>
